version: "3.8"

services:
  tetra_scanner:
    image: ghcr.io/minglarn/tetra_scanner:latest
    container_name: tetra_scanner
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./logs:/app/logs
