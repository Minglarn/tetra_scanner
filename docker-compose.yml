services:
  tetra_scanner:
    image: ghcr.io/minglarn/tetra_scanner:latest
    container_name: tetra_scanner
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /home/minglarn/tetra_scanner/data:/app/logs
    environment:
      # --- RTL-SDR Konfiguration ---
      - RTL_DEVICE_INDEX=1
      - RTL_GAIN=24.0
      - RTL_PPM=0
      - CENTER_FREQ=427750000
      - TETRA_CHANNELS=427000000:71,427300000:17,427550000:23,427850000:1,427950000:16,428500000:7

      # --- MQTT Output ---
      - MQTT_ENABLED=true
      - MQTT_HOST=192.168.1.121
      - MQTT_PORT=1883
      - MQTT_USER=home-assistant-server
      - MQTT_PASS=change_me
      - MQTT_BASE_TOPIC=tetra/240_11
      - HA_DISCOVERY_ENABLED=true
      - HA_DISCOVERY_PREFIX=homeassistant

      # --- Externa UDP JSON-mottagare ---
      - UDP_OUT_ENABLED=false
      - UDP_OUT_TARGETS=192.168.1.242:5555
      - UDP_OUT_INCLUDE_RAW=false

      # --- System & Lagring ---
      - HOST_NAME=iridium
      - LOG_DIR=/app/logs
