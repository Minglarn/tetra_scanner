<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRA Scanner Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 font-mono min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <div class="w-3 h-8 bg-emerald-500 rounded-sm"></div>
      <div>
        <h1 class="text-xl font-bold tracking-wider text-gray-100 uppercase">TETRA Scanner Dashboard</h1>
        <p class="text-xs text-gray-400">
          Version <span class="text-emerald-400 font-semibold">{{ version }}</span>
          <span class="mx-2 text-gray-600">|</span>
          Mode: <span class="text-cyan-400 uppercase font-semibold">{{ mode }}</span>
          <span class="mx-2 text-gray-600">|</span>
          Author: <span class="text-gray-300">Minglarn</span>
        </p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="text-xs text-gray-400 bg-gray-800/80 border border-gray-700 px-3 py-1.5 rounded">
        Events: <span id="event-counter" class="text-gray-100 font-bold">0</span>
      </div>
      <div id="ws-badge" class="flex items-center gap-2 px-3 py-1.5 rounded border text-xs font-semibold bg-red-950/60 border-red-700/60 text-red-300">
        <span id="ws-dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
        <span id="ws-status-text">DISCONNECTED</span>
      </div>
    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 p-4 max-w-[1920px] w-full mx-auto overflow-hidden">

    <!-- Sidebar: Discovered Networks -->
    <section class="lg:col-span-1 bg-gray-900 border border-gray-800 rounded-lg flex flex-col max-h-[85vh]">
      <div class="px-4 py-3 border-b border-gray-800 flex items-center justify-between">
        <div>
          <h2 class="text-sm font-bold uppercase tracking-wider text-gray-200">Discovered Networks</h2>
          <p class="text-[11px] text-gray-500">Decoded via SYSINFO / Broadcast</p>
        </div>
        <button id="refresh-networks-btn" class="text-xs px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 rounded transition">
          Refresh
        </button>
      </div>

      <div id="networks-container" class="p-3 space-y-2.5 overflow-y-auto flex-1 text-xs">
        <div class="text-gray-500 italic py-4 text-center">Loading networks...</div>
      </div>
    </section>

    <!-- Main Panel: Real-time Event Stream -->
    <section class="lg:col-span-3 bg-gray-900 border border-gray-800 rounded-lg flex flex-col h-[85vh]">
      <!-- Filter Bar -->
      <div class="px-4 py-3 border-b border-gray-800 bg-gray-900/90 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-4 text-xs">
          <span class="text-gray-400 font-semibold uppercase tracking-wider">Filters:</span>

          <label class="inline-flex items-center gap-2 cursor-pointer select-none bg-gray-800/80 border border-gray-700 px-2.5 py-1 rounded hover:border-gray-600">
            <input type="checkbox" id="filter-triona" checked class="accent-emerald-500 rounded" />
            <span class="text-gray-200">Show TrionaGateway</span>
          </label>

          <label class="inline-flex items-center gap-2 cursor-pointer select-none bg-gray-800/80 border border-gray-700 px-2.5 py-1 rounded hover:border-gray-600">
            <input type="checkbox" id="filter-control" checked class="accent-emerald-500 rounded" />
            <span class="text-gray-200">Show Control Frames</span>
          </label>

          <label class="inline-flex items-center gap-2 cursor-pointer select-none bg-gray-800/80 border border-gray-700 px-2.5 py-1 rounded hover:border-gray-600">
            <input type="checkbox" id="autoscroll-toggle" checked class="accent-emerald-500 rounded" />
            <span class="text-gray-200">Auto-Scroll</span>
          </label>
        </div>

        <div class="flex items-center gap-2">
          <input
            type="text"
            id="search-input"
            placeholder="Filter by SSI, frequency or text..."
            class="bg-gray-950 border border-gray-700 rounded px-3 py-1 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-emerald-500 w-56"
          />
          <button
            id="clear-log-btn"
            class="text-xs px-3 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 rounded transition"
          >
            Clear
          </button>
        </div>
      </div>

      <!-- Log Stream Container -->
      <div id="log-stream" class="flex-1 overflow-y-auto p-3 space-y-1.5 bg-gray-950/60 text-xs">
        <div id="empty-log-placeholder" class="text-gray-500 italic py-8 text-center">
          Waiting for real-time TETRA events...
        </div>
      </div>
    </section>

  </main>

  <script>
    const logStream = document.getElementById("log-stream");
    const emptyPlaceholder = document.getElementById("empty-log-placeholder");
    const wsBadge = document.getElementById("ws-badge");
    const wsDot = document.getElementById("ws-dot");
    const wsStatusText = document.getElementById("ws-status-text");
    const eventCounterEl = document.getElementById("event-counter");
    const filterTrionaEl = document.getElementById("filter-triona");
    const filterControlEl = document.getElementById("filter-control");
    const autoScrollEl = document.getElementById("autoscroll-toggle");
    const searchInputEl = document.getElementById("search-input");
    const clearLogBtn = document.getElementById("clear-log-btn");
    const networksContainer = document.getElementById("networks-container");
    const refreshNetworksBtn = document.getElementById("refresh-networks-btn");

    let totalEvents = 0;
    const MAX_DOM_ROWS = 500;

    function setWsStatus(connected) {
      if (connected) {
        wsBadge.className = "flex items-center gap-2 px-3 py-1.5 rounded border text-xs font-semibold bg-emerald-950/60 border-emerald-700/60 text-emerald-300";
        wsDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
        wsStatusText.textContent = "CONNECTED";
      } else {
        wsBadge.className = "flex items-center gap-2 px-3 py-1.5 rounded border text-xs font-semibold bg-red-950/60 border-red-700/60 text-red-300";
        wsDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
        wsStatusText.textContent = "DISCONNECTED";
      }
    }

    function getCategoryStyle(category) {
      const cat = (category || "OTHER").toUpperCase();
      switch (cat) {
        case "SDS":
          return {
            badge: "bg-blue-950/80 text-blue-300 border-blue-700/70",
            rowBorder: "border-l-2 border-l-blue-500",
            text: "text-blue-200"
          };
        case "ROAMING":
          return {
            badge: "bg-amber-950/80 text-amber-300 border-amber-700/70",
            rowBorder: "border-l-2 border-l-amber-500",
            text: "text-amber-200"
          };
        case "CALL":
          return {
            badge: "bg-emerald-950/80 text-emerald-300 border-emerald-700/70",
            rowBorder: "border-l-2 border-l-emerald-500",
            text: "text-emerald-200"
          };
        case "STATUS":
          return {
            badge: "bg-purple-950/80 text-purple-300 border-purple-700/70",
            rowBorder: "border-l-2 border-l-purple-500",
            text: "text-purple-200"
          };
        default:
          return {
            badge: "bg-gray-800 text-gray-300 border-gray-700",
            rowBorder: "border-l-2 border-l-gray-600",
            text: "text-gray-300"
          };
      }
    }

    function formatTime(isoStr) {
      if (!isoStr) return "--:--:--";
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return d.toLocaleTimeString("en-GB", { hour12: false });
      } catch (e) {
        return isoStr;
      }
    }

    function shouldHideRow(rowEl) {
      const humanText = rowEl.dataset.humanText || "";
      const fullSearch = rowEl.dataset.searchText || "";

      if (!filterTrionaEl.checked && humanText.includes("TrionaGateway")) {
        return true;
      }
      if (!filterControlEl.checked && humanText.includes("Control Frame")) {
        return true;
      }
      const query = searchInputEl.value.trim().toLowerCase();
      if (query && !fullSearch.includes(query)) {
        return true;
      }
      return false;
    }

    function applyFiltersToAllRows() {
      const rows = logStream.querySelectorAll(".event-row");
      rows.forEach((row) => {
        if (shouldHideRow(row)) {
          row.classList.add("hidden");
        } else {
          row.classList.remove("hidden");
        }
      });
    }

    filterTrionaEl.addEventListener("change", applyFiltersToAllRows);
    filterControlEl.addEventListener("change", applyFiltersToAllRows);
    searchInputEl.addEventListener("input", applyFiltersToAllRows);

    clearLogBtn.addEventListener("click", () => {
      const rows = logStream.querySelectorAll(".event-row");
      rows.forEach((r) => r.remove());
      totalEvents = 0;
      eventCounterEl.textContent = "0";
      emptyPlaceholder.classList.remove("hidden");
    });

    function appendEventRow(ev) {
      if (!ev || typeof ev !== "object") return;
      if (emptyPlaceholder) {
        emptyPlaceholder.classList.add("hidden");
      }

      const category = (ev.category || "OTHER").toUpperCase();
      const freqMhz = ev.freq_mhz || "?.????";
      const la = ev.la !== undefined && ev.la !== null ? `LA${ev.la}` : "";
      const humanText = ev.human_text || ev.sds_text || ev.status_text || ev.pdu || JSON.stringify(ev);
      const timeStr = formatTime(ev.timestamp);
      const style = getCategoryStyle(category);

      const row = document.createElement("div");
      row.className = `event-row bg-gray-900/90 hover:bg-gray-800/80 border border-gray-800/90 ${style.rowBorder} rounded px-3 py-2 flex flex-wrap sm:flex-nowrap items-start gap-2.5 transition`;
      row.dataset.humanText = humanText;
      row.dataset.searchText = `${category} ${freqMhz} ${la} ${humanText} ${ev.ssi || ""} ${ev.dest_ssi || ""} ${ev.gssi || ""}`.toLowerCase();

      const timeSpan = document.createElement("span");
      timeSpan.className = "text-gray-500 shrink-0 select-all";
      timeSpan.textContent = timeStr;

      const catBadge = document.createElement("span");
      catBadge.className = `px-2 py-0.5 rounded border text-[11px] font-bold shrink-0 ${style.badge}`;
      catBadge.textContent = `[${category}]`;

      const freqBadge = document.createElement("span");
      freqBadge.className = "px-2 py-0.5 rounded bg-gray-800/90 border border-gray-700 text-cyan-300 shrink-0";
      freqBadge.textContent = la ? `${freqMhz} MHz (${la})` : `${freqMhz} MHz`;

      const msgSpan = document.createElement("span");
      msgSpan.className = `break-all flex-1 ${style.text}`;
      msgSpan.textContent = humanText;

      row.appendChild(timeSpan);
      row.appendChild(catBadge);
      row.appendChild(freqBadge);
      row.appendChild(msgSpan);

      if (ev.gps_lat !== undefined && ev.gps_lat !== null && ev.gps_lon !== undefined && ev.gps_lon !== null) {
        const mapLink = document.createElement("a");
        mapLink.href = `https://www.google.com/maps?q=${ev.gps_lat},${ev.gps_lon}`;
        mapLink.target = "_blank";
        mapLink.rel = "noopener noreferrer";
        mapLink.className = "px-2 py-0.5 rounded bg-emerald-950 border border-emerald-700 text-emerald-300 hover:bg-emerald-900 text-[11px] shrink-0";
        mapLink.textContent = "Map";
        row.appendChild(mapLink);
      }

      if (shouldHideRow(row)) {
        row.classList.add("hidden");
      }

      logStream.appendChild(row);
      totalEvents += 1;
      eventCounterEl.textContent = String(totalEvents);

      const allRows = logStream.querySelectorAll(".event-row");
      if (allRows.length > MAX_DOM_ROWS) {
        allRows[0].remove();
      }

      if (autoScrollEl.checked) {
        logStream.scrollTop = logStream.scrollHeight;
      }
    }

    async function loadNetworks() {
      try {
        const res = await fetch("/api/networks");
        if (!res.ok) return;
        const list = await res.json();
        networksContainer.innerHTML = "";

        if (!Array.isArray(list) || list.length === 0) {
          networksContainer.innerHTML = `<div class="text-gray-500 italic py-4 text-center">No networks discovered yet.</div>`;
          return;
        }

        list.forEach((net) => {
          const card = document.createElement("div");
          card.className = "bg-gray-950/80 border border-gray-800 rounded p-2.5 space-y-1";

          const topRow = document.createElement("div");
          topRow.className = "flex items-center justify-between";

          const freqEl = document.createElement("span");
          freqEl.className = "text-cyan-400 font-bold";
          freqEl.textContent = `${net.freq_mhz || "?"} MHz`;

          const laEl = document.createElement("span");
          laEl.className = "px-1.5 py-0.5 rounded bg-emerald-950/80 border border-emerald-700/60 text-emerald-300 text-[10px] font-bold";
          laEl.textContent = `LA ${net.la !== undefined && net.la !== null ? net.la : "?"}`;

          topRow.appendChild(freqEl);
          topRow.appendChild(laEl);

          const metaRow = document.createElement("div");
          metaRow.className = "text-gray-300 flex items-center justify-between text-[11px]";
          metaRow.textContent = `MCC: ${net.mcc ?? "?"} | MNC: ${net.mnc ?? "?"}`;

          const timeRow = document.createElement("div");
          timeRow.className = "text-gray-500 text-[10px]";
          timeRow.textContent = `Seen: ${formatTime(net.timestamp)} via ${net.pdu || "SYSINFO"}`;

          card.appendChild(topRow);
          card.appendChild(metaRow);
          card.appendChild(timeRow);
          networksContainer.appendChild(card);
        });
      } catch (e) {
        // Ignore transient network errors
      }
    }

    refreshNetworksBtn.addEventListener("click", loadNetworks);

    function connectWebSocket() {
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${proto}//${window.location.host}/ws/events`;
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        setWsStatus(true);
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          appendEventRow(data);
        } catch (e) {
          // Ignore malformed JSON line
        }
      };

      ws.onclose = () => {
        setWsStatus(false);
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    loadNetworks();
    setInterval(loadNetworks, 15000);
    connectWebSocket();
  </script>
</body>
</html>
